# ─────────────────────────────────────────────────────────────────────
# Integracion continua.
#
# Los trabajos corren en paralelo salvo donde hay dependencia real: un
# fallo de formato no deberia hacer esperar al resultado de los tests.
#
# `arquitectura` es un trabajo propio y no un paso dentro de `calidad`
# a proposito: cuando falla, el nombre del check en el PR dice
# exactamente que se rompio sin tener que abrir el log.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: no
# tiene sentido gastar minutos en validar un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  calidad:
    name: Formato, linting y tipado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Formato
        run: ruff format --check src tests migrations

      - name: Linting
        run: ruff check src tests migrations

      - name: Tipado estricto
        run: mypy --config-file pyproject.toml

  arquitectura:
    name: Contratos de arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # Verifica que las capas no se han cruzado. Es lo que impide que
      # la arquitectura hexagonal se degrade a base de imports
      # "temporales" que nadie vuelve a quitar.
      - name: Verificar capas y contextos acotados
        run: lint-imports --config importlinter.ini

  tests:
    name: Tests unitarios y de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar suite
        run: pytest -q --cov=src/mailauto --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 7

  seguridad:
    name: Analisis de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: SAST
        run: bandit -q -c pyproject.toml -r src

      - name: Dependencias vulnerables
        run: pip-audit --strict --skip-editable

      # Secretos filtrados en cualquier punto del historial, no solo en
      # el ultimo commit: una clave borrada en un commit posterior sigue
      # estando comprometida y recuperable.
      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrato-openapi:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    needs: [calidad]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # El esquema generado se versiona y el frontend genera su cliente
      # TypeScript a partir de el. Si cambia la API sin regenerarlo, el
      # contrato se desincroniza en silencio y el frontend se entera en
      # produccion. Aqui se entera en el PR.
      - name: Regenerar y comparar openapi.json
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          OIDC_ISSUER: https://ci.ejemplo.com/
          OIDC_AUDIENCE: https://api.ejemplo.com
          MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          STORAGE_ACCESS_KEY: ci
          STORAGE_SECRET_KEY: ci
        run: |
          python scripts/exportar_openapi.py openapi.json
          git diff --exit-code openapi.json \
            || { echo "::error::openapi.json esta desactualizado. Ejecuta scripts/exportar_openapi.py y commitea el resultado."; exit 1; }

  imagenes:
    name: Construccion y escaneo de imagenes
    runs-on: ubuntu-latest
    needs: [calidad, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen de API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mailauto-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen de worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: mailauto-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El worker es el contenedor que abre ficheros de terceros, asi que
      # una CVE en sus bibliotecas nativas importa mas que en ningun otro.
      - name: Escanear imagen de worker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mailauto-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Escanear imagen de API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mailauto-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generar SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: mailauto-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json
