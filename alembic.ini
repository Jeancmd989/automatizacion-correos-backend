[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Las migraciones se nombran con fecha y descripcion, no con hashes
# sueltos: el orden cronologico tiene que ser evidente al listar el
# directorio, sin abrir cada fichero.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# La URL la inyecta migrations/env.py desde la configuracion de la
# aplicacion. Dejarla aqui significaria una credencial en el repositorio.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
