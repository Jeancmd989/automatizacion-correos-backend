# ─────────────────────────────────────────────────────────────────────
# Entorno de desarrollo completo: `docker compose up`.
#
# Levanta API, los dos workers, PostgreSQL, Redis, el almacen de objetos
# y Jaeger. El
# objetivo es que nadie tenga que instalar Tesseract ni configurar nada
# a mano para empezar a trabajar.
#
# Las credenciales de este fichero son de desarrollo y solo valen aqui.
# La configuracion real vive en .env, que no esta versionado.
# ─────────────────────────────────────────────────────────────────────

name: automatizacion-correos

x-entorno-comun: &entorno-comun
  ENVIRONMENT: development
  # Imprescindible para que la recarga en caliente sirva de algo.
  #
  # La imagen instala el paquete con `pip install .`, asi que `import
  # mailauto` resuelve a site-packages. Sin esta variable, el codigo
  # montado en /app/src no se importa nunca: se edita un fichero, uvicorn
  # anuncia la recarga y sigue sirviendo exactamente lo que habia en la
  # imagen. Es el peor tipo de fallo de entorno, porque parece funcionar.
  PYTHONPATH: /app/src
  DATABASE_URL: postgresql+asyncpg://mailauto_app:desarrollo@postgres:5432/mailauto
  REDIS_URL: redis://redis:6379/0
  STORAGE_ENDPOINT_URL: http://almacen:4566
  STORAGE_ACCESS_KEY: desarrollo
  STORAGE_SECRET_KEY: desarrollo-secreto
  STORAGE_BUCKET: adjuntos
  OTEL_EXPORTER_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailauto
      POSTGRES_USER: mailauto_owner
      POSTGRES_PASSWORD: desarrollo
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      # Crea el rol de aplicacion SIN privilegios de propietario. Es
      # imprescindible: PostgreSQL exime al propietario de las politicas
      # RLS, asi que conectarse como `mailauto_owner` anularia todo el
      # aislamiento multi-tenant sin ningun aviso.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailauto_owner -d mailauto"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - datos_redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacen de objetos compatible con S3.
  #
  # Fue MinIO hasta que su imagen desaparecio de Docker Hub (y quay.io
  # responde 401): un `docker compose up` recien clonado no podia
  # arrancar. LocalStack es publica, mantenida, implementa SSE-S3 —que el
  # adaptador exige en cada PutObject— y firma URLs presignadas v4 que de
  # verdad descargan. Alternativas descartadas: `bitnamilegacy/minio`,
  # marcada como legado; Garage, que no soporta cifrado en reposo; y
  # `adobe/s3mock`, sin garantias sobre presignado.
  #
  # Solo se habilita S3: el resto del catalogo de LocalStack no se usa y
  # arrancarlo alargaria el inicio sin aportar nada.
  almacen:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      # LocalStack acepta cualquier credencial; se nombran para que quede
      # claro que no protegen nada.
      AWS_ACCESS_KEY_ID: desarrollo
      AWS_SECRET_ACCESS_KEY: desarrollo-secreto
    volumes:
      - datos_almacen:/var/lib/localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # interfaz web de trazas
      - "4318:4318"    # OTLP/HTTP

  migraciones:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *entorno-comun
      # Alembic si usa el rol propietario: es quien crea las tablas y
      # define las politicas. La aplicacion nunca se conecta con el.
      DATABASE_URL: postgresql+asyncpg://mailauto_owner:desarrollo@postgres:5432/mailauto
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *entorno-comun
    env_file: [.env]
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      almacen: { condition: service_healthy }
      migraciones: { condition: service_completed_successfully }
    # Recarga en caliente: el codigo se monta y uvicorn vigila cambios.
    volumes:
      - ./src:/app/src:ro
    command: >
      uvicorn mailauto.bootstrap.app:crear_app --factory
      --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src

  worker-ingesta:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["arq", "mailauto.workers.settings.WorkerDeIngesta"]
    environment: *entorno-comun
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      almacen: { condition: service_healthy }
      migraciones: { condition: service_completed_successfully }
    volumes:
      - ./src:/app/src:ro
    # ── Endurecimiento del contenedor que parsea ficheros ajenos ──
    # Replica en desarrollo el perfil de produccion, para que un fallo
    # por restricciones aparezca aqui y no al desplegar.
    read_only: true
    tmpfs:
      - /tmp/mailauto:size=512m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    # Margen para que el job en curso termine antes de recibir SIGKILL.
    stop_grace_period: 60s

  worker-cron:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["arq", "mailauto.workers.settings.WorkerDeCron"]
    environment: *entorno-comun
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migraciones: { condition: service_completed_successfully }
    volumes:
      - ./src:/app/src:ro
    read_only: true
    tmpfs:
      - /tmp/mailauto:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Una sola replica: dos procesos de cron duplicarian cada purga y
    # cada refresco programado.
    deploy:
      replicas: 1

volumes:
  datos_postgres:
  datos_redis:
  datos_almacen:
