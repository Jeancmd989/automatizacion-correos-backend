; ─────────────────────────────────────────────────────────────────────
; Contratos de arquitectura — ejecutables, no documentales.
;
; El pipeline de CI ejecuta `lint-imports` y falla si alguna de estas
; reglas se viola. Es lo que impide que la arquitectura hexagonal se
; degrade con el tiempo a base de imports "temporales".
;
; Ejecutar en local:  lint-imports
; ─────────────────────────────────────────────────────────────────────
[importlinter]
root_package = mailauto
include_external_packages = True


; ── 1. Las capas se apilan en un orden y no se saltan ────────────────
; Lo de arriba puede importar lo de abajo; nunca al reves.
[importlinter:contract:capas]
name = Las capas respetan la direccion de dependencia
type = layers
layers =
    mailauto.api
    mailauto.modules
    mailauto.shared
exhaustive = False


; ── 2. El dominio no conoce infraestructura ──────────────────────────
; Esta es la regla que sostiene toda la arquitectura hexagonal: el
; dominio define puertos, la infraestructura los implementa, y el
; dominio jamas mira hacia afuera.
[importlinter:contract:dominio-puro]
name = El dominio no importa infraestructura, aplicacion ni api
type = forbidden
source_modules =
    mailauto.modules.identity.domain
    mailauto.modules.mailbox.domain
    mailauto.modules.ingestion.domain
    mailauto.modules.audit.domain
forbidden_modules =
    mailauto.api
    mailauto.bootstrap
    mailauto.workers
    mailauto.modules.identity.infrastructure
    mailauto.modules.identity.application
    mailauto.modules.mailbox.infrastructure
    mailauto.modules.mailbox.application
    mailauto.modules.ingestion.infrastructure
    mailauto.modules.ingestion.application
    mailauto.modules.audit.infrastructure
    mailauto.modules.audit.application
    sqlalchemy
    fastapi
    httpx
    arq
    redis
    aioboto3


; ── 3. La aplicacion orquesta, no conoce adaptadores ─────────────────
; Los casos de uso dependen de puertos abstractos. Si un caso de uso
; importa el adaptador de Gmail, deja de ser testeable sin red.
[importlinter:contract:aplicacion-sobre-puertos]
name = La capa de aplicacion no importa infraestructura ni api
type = forbidden
source_modules =
    mailauto.modules.identity.application
    mailauto.modules.mailbox.application
    mailauto.modules.ingestion.application
    mailauto.modules.audit.application
forbidden_modules =
    mailauto.api
    mailauto.bootstrap
    mailauto.modules.identity.infrastructure
    mailauto.modules.mailbox.infrastructure
    mailauto.modules.ingestion.infrastructure
    mailauto.modules.audit.infrastructure
    fastapi


; ── 4. La API no toca adaptadores directamente ───────────────────────
; Los routers reciben casos de uso ya construidos por el composition
; root. Sin esta regla, un router termina abriendo una sesion de BD.
;
; `allow_indirect_imports` es deliberado y no una concesion: lo que esta
; regla prohibe es el acoplamiento DIRECTO de un router a un adaptador.
; Indirectamente todo router alcanza la infraestructura, porque
; `api.deps` tipa el `Contenedor` y el contenedor, por definicion,
; conoce todas las capas: es el unico punto del sistema autorizado a
; hacerlo. Sin esta opcion el contrato se romperia siempre, por el
; propio diseño, y un contrato que falla siempre se acaba desactivando.
; La pureza del dominio y de la capa de aplicacion si se verifican de
; forma transitiva (contratos 2 y 3), que es donde importa.
[importlinter:contract:api-sin-infraestructura]
name = Los routers no importan infraestructura directamente
type = forbidden
allow_indirect_imports = True
source_modules =
    mailauto.api.v1
forbidden_modules =
    mailauto.modules.identity.infrastructure
    mailauto.modules.mailbox.infrastructure
    mailauto.modules.ingestion.infrastructure
    mailauto.modules.audit.infrastructure
    sqlalchemy
    asyncpg


; ── 5. Los modulos no se importan entre si ───────────────────────────
; Cada contexto acotado es independiente. La comunicacion entre
; modulos pasa por el composition root o por eventos de dominio, no
; por imports cruzados que los acoplarian para siempre.
[importlinter:contract:modulos-independientes]
name = Los contextos acotados no se importan entre si
type = independence
modules =
    mailauto.modules.identity
    mailauto.modules.mailbox
    mailauto.modules.ingestion
    mailauto.modules.audit


; ── 6. El kernel compartido no conoce a nadie ────────────────────────
; `shared` es infraestructura transversal sin reglas de negocio. Si
; empieza a importar modulos, se convierte en un segundo dominio
; encubierto y el acoplamiento se vuelve circular.
[importlinter:contract:shared-aislado]
name = El kernel compartido no importa modulos, api ni bootstrap
type = forbidden
source_modules =
    mailauto.shared
forbidden_modules =
    mailauto.modules
    mailauto.api
    mailauto.bootstrap
    mailauto.workers
